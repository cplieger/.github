# Lint gate for the org-config repo. Calls the central cplieger/ci meta
# workflow, which auto-detects surfaces; for this repo that means markdown lint
# plus actionlint on the workflow files. Emits the required `ci / validate`
# check. PR-only: branch protection requires the check before merge, so a
# post-merge re-run on main would be redundant (standard for config-only
# repos). Hand-maintained (this repo is the sync source, not a sync target);
# the pinned SHA is bumped by Renovate via the `# v3` comment.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # The meta workflow's dead-code job uploads SARIF, and a called job cannot
    # request more than its caller grants.
    permissions:
      contents: read
      security-events: write
    uses: cplieger/ci/.github/workflows/ci.yaml@67500561d8a8a857939b4f25ccf70f33a3baa4c4 # v3
