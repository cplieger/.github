name: Question
description: Ask how to do something with the project.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome. Check the README and the existing issues first. If the project does something wrong, use the bug report form instead. For a security vulnerability, follow the security policy.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you are trying to do, and what is unclear.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The version you use, your configuration and what you already tried. Remove passwords, tokens and other secrets first.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true
